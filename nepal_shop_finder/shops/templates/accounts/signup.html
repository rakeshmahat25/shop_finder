{% extends 'base.html' %}

{% block title %}Sign Up - Location Data Explorer{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <h2 class="mb-4 text-center">Create an Account</h2>

        <form method="post">
            {% csrf_token %}

            <!-- form.as_p renders each field in a <p> tag. It's simple and effective. -->
            {{ form.as_p }}

            <button type="submit" class="btn w-100 mt-3" style="background-color: var(--primary-color); color: white;">Sign Up</button>
        </form>

        <div class="mt-3 text-center">
            Already have an account?
            <!-- Use the namespaced URL -->
            <a href="{% url 'shops:login' %}">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
