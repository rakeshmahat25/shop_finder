{% extends 'base.html' %}

{% block title %}Login - Location Data Explorer{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <h2 class="mb-4 text-center">Login</h2>

        <form method="post" action="{% url 'shops:login' %}">
            {% csrf_token %}

            <!-- This will display errors like "Invalid username or password" -->
            {% if form.non_field_errors %}
                <div class="alert alert-danger">
                    {{ form.non_field_errors.as_ul }}
                </div>
            {% endif %}

            <!-- Render the form fields. This gives you more control than form.as_p -->
            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
                <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required>
            </div>

            <button type="submit" class="btn w-100" style="background-color: var(--primary-color); color: white;">Login</button>
        </form>

        <div class="mt-3 text-center">
            Don't have an account?
            <!-- Use the namespaced URL -->
            <a href="{% url 'shops:signup' %}">Sign up here</a>
        </div>
    </div>
</div>
{% endblock %}
