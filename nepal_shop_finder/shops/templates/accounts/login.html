
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Location Data Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #3d9b63 0%, #1e4d3b 100%);
        }
        .input-focus:focus {
            border-color: #3d9b63;
            box-shadow: 0 0 0 3px rgba(61, 155, 99, 0.2);
        }
        .password-toggle {
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center">
    <div class="container mx-auto px-4">
        <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl">
            <div class="gradient-bg p-6 text-white">
                <div class="flex items-center justify-center mb-2">
                    <i class="fas fa-map-marked-alt text-3xl mr-3"></i>
                    <h1 class="text-2xl font-bold">Location Data Explorer</h1>
                </div>
                <p class="text-center text-white/90">Login to explore location data</p>
            </div>

            <div class="p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Login</h2>

                <form method="post" action="{% url 'shops:login' %}" class="space-y-5">
                    {% csrf_token %}
                    
                    {% if form.non_field_errors %}
                        <div class="bg-red-100 text-red-700 px-4 py-2 rounded text-sm">
                            {{ form.non_field_errors.as_text }}
                        </div>
                    {% endif %}

                    <div>
                        <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <div class="relative">
                            <input type="text" name="username" id="{{ form.username.id_for_label }}" required
                                class="w-full px-4 py-2 border rounded-lg input-focus focus:outline-none"
                                placeholder="Enter your username">
                            <i class="fas fa-user absolute right-3 top-3 text-gray-400"></i>
                        </div>
                    </div>

                    <div>
                        <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <div class="relative">
                            <input type="password" name="password" id="{{ form.password.id_for_label }}" required
                                class="w-full px-4 py-2 border rounded-lg input-focus focus:outline-none pr-10"
                                placeholder="••••••••">
                            <span id="togglePassword" class="password-toggle absolute text-gray-400">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full gradient-bg text-white py-3 px-4 rounded-lg font-medium hover:opacity-90 transition duration-300 flex items-center justify-center">
                        <i class="fas fa-sign-in-alt mr-2"></i> Login
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-600">
                        Don't have an account?
                        <a href="{% url 'shops:signup' %}" class="text-green-600 font-medium hover:underline ml-1">Sign up</a>
                    </p>
                </div>

                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500">Or login with</span>
                        </div>
                    </div>

                    <div class="mt-6 grid grid-cols-2 gap-3">
                        <button type="button" class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50">
                            <i class="fab fa-google text-red-500 mr-2"></i> Google
                        </button>
                        <button type="button" class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50">
                            <i class="fab fa-github text-gray-800 mr-2"></i> GitHub
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordField = document.querySelector('#{{ form.password.id_for_label }}');

        togglePassword.addEventListener('click', function () {
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
